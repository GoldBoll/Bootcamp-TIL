<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-label="포인터는 대상의 주소를 담는 독립 변수, 레퍼런스는 대상의 별칭">
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#1c2330" stroke="#39414f"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">포인터(T*)는 독립 변수, 레퍼런스(T&amp;)는 별칭</text>
  <line x1="380" y1="60" x2="380" y2="376" stroke="#39414f" stroke-dasharray="4 5"/>

  <!-- LEFT: pointer -->
  <text x="40" y="86" font-size="16" font-weight="600" fill="#58a6ff" font-family="Consolas,'SF Mono',monospace">int x = 10;  int* p = &amp;x;</text>

  <!-- x object -->
  <rect x="230" y="120" width="120" height="58" rx="8" fill="#263041" stroke="#3d4859"/>
  <text x="290" y="146" text-anchor="middle" font-size="14" fill="#9aa4b2">x</text>
  <text x="290" y="167" text-anchor="middle" font-size="18" font-weight="700" fill="#56d364" font-family="Consolas,monospace">10</text>
  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#9aa4b2" font-family="Consolas,monospace">주소 0x1004</text>

  <!-- p pointer -->
  <rect x="40" y="250" width="140" height="58" rx="8" fill="#263041" stroke="#3d4859"/>
  <text x="110" y="276" text-anchor="middle" font-size="14" fill="#9aa4b2">p</text>
  <text x="110" y="297" text-anchor="middle" font-size="16" font-weight="700" fill="#e3b341" font-family="Consolas,monospace">0x1004</text>
  <text x="110" y="326" text-anchor="middle" font-size="11" fill="#9aa4b2" font-family="Consolas,monospace">주소 0x2000 (자기 저장소)</text>

  <!-- arrow p -> x -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#e3b341"/>
    </marker>
  </defs>
  <path d="M180,262 C230,240 250,210 288,180" fill="none" stroke="#e3b341" stroke-width="2" marker-end="url(#ah)"/>
  <text x="196" y="220" font-size="11" fill="#e3b341">주소값으로 x를 가리킴</text>

  <text x="40" y="366" font-size="12.5" fill="#c9d1d9">p는 x의 <tspan fill="#e3b341" font-weight="700">주소</tspan>를 담는 별개의 변수 · 재할당·nullptr·산술 가능</text>

  <!-- RIGHT: reference -->
  <text x="410" y="86" font-size="16" font-weight="600" fill="#bc8cff" font-family="Consolas,'SF Mono',monospace">int x = 10;  int&amp; r = x;</text>

  <!-- single object, two names -->
  <rect x="560" y="180" width="140" height="66" rx="8" fill="#263041" stroke="#3d4859"/>
  <text x="630" y="219" text-anchor="middle" font-size="20" font-weight="700" fill="#56d364" font-family="Consolas,monospace">10</text>
  <text x="630" y="272" text-anchor="middle" font-size="11" fill="#9aa4b2" font-family="Consolas,monospace">주소 0x1004 (하나의 객체)</text>

  <!-- name tags x and r both point to same box -->
  <g font-family="Consolas,monospace">
    <rect x="440" y="150" width="54" height="34" rx="6" fill="#1c2330" stroke="#bc8cff"/>
    <text x="467" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#bc8cff">x</text>
    <rect x="440" y="242" width="54" height="34" rx="6" fill="#1c2330" stroke="#bc8cff"/>
    <text x="467" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#bc8cff">r</text>
  </g>
  <path d="M494,167 C525,175 535,188 558,200" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#ahp)"/>
  <path d="M494,259 C525,251 535,238 558,226" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#ahp)"/>
  <defs>
    <marker id="ahp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#bc8cff"/>
    </marker>
  </defs>
  <text x="410" y="366" font-size="12.5" fill="#c9d1d9">r은 x와 <tspan fill="#bc8cff" font-weight="700">같은 객체의 다른 이름</tspan> · 선언 시 1회 바인딩, 별도 저장소 없음</text>
</svg>
