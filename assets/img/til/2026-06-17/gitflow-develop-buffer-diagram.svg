<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-label="Git Flow에서 feat 브랜치는 develop에서 분기해 develop으로 병합되고, develop은 안정된 시점에만 main으로 병합되어 main이 깨질 위험을 흡수하는 완충 역할을 한다">
  <rect x="0" y="0" width="760" height="340" rx="14" fill="#1c2330" stroke="#39414f"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">Git Flow — develop 완충 브랜치</text>

  <!-- lane labels -->
  <text x="30" y="86" font-size="14" font-weight="700" fill="#bc8cff" font-family="Consolas,monospace">main</text>
  <text x="30" y="186" font-size="14" font-weight="700" fill="#58a6ff" font-family="Consolas,monospace">develop</text>
  <text x="30" y="286" font-size="14" font-weight="700" fill="#56d364" font-family="Consolas,monospace">feat/*</text>

  <!-- main line -->
  <line x1="120" y1="80" x2="700" y2="80" stroke="#bc8cff" stroke-width="3"/>
  <!-- develop line -->
  <line x1="120" y1="180" x2="700" y2="180" stroke="#58a6ff" stroke-width="3"/>

  <!-- develop created from main -->
  <path d="M120,80 C120,120 120,140 120,178" fill="none" stroke="#58a6ff" stroke-width="2.5"/>

  <!-- feat/A branch: develop@240 -> feat -> develop@380 -->
  <path d="M240,180 C240,220 260,260 300,260" fill="none" stroke="#56d364" stroke-width="2.5"/>
  <line x1="300" y1="260" x2="360" y2="260" stroke="#56d364" stroke-width="3"/>
  <path d="M360,260 C400,260 380,220 380,180" fill="none" stroke="#56d364" stroke-width="2.5"/>

  <!-- feat/B branch: develop@440 -> feat -> develop@560 -->
  <path d="M440,180 C440,220 460,260 500,260" fill="none" stroke="#56d364" stroke-width="2.5"/>
  <line x1="500" y1="260" x2="560" y2="260" stroke="#56d364" stroke-width="3"/>
  <path d="M560,260 C600,260 580,220 580,180" fill="none" stroke="#56d364" stroke-width="2.5"/>

  <!-- release develop -> main -->
  <path d="M620,180 C620,140 620,120 620,82" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="636" y="130" font-size="11.5" fill="#e3b341" font-family="Consolas,monospace">release</text>

  <!-- commit dots -->
  <g>
    <circle cx="120" cy="80" r="7" fill="#bc8cff"/><circle cx="620" cy="80" r="7" fill="#bc8cff"/>
    <circle cx="120" cy="180" r="6" fill="#58a6ff"/><circle cx="240" cy="180" r="6" fill="#58a6ff"/><circle cx="380" cy="180" r="6" fill="#58a6ff"/><circle cx="440" cy="180" r="6" fill="#58a6ff"/><circle cx="560" cy="180" r="6" fill="#58a6ff"/><circle cx="620" cy="180" r="6" fill="#58a6ff"/><circle cx="680" cy="180" r="6" fill="#58a6ff"/>
    <circle cx="300" cy="260" r="6" fill="#56d364"/><circle cx="330" cy="260" r="6" fill="#56d364"/><circle cx="360" cy="260" r="6" fill="#56d364"/>
    <circle cx="500" cy="260" r="6" fill="#56d364"/><circle cx="530" cy="260" r="6" fill="#56d364"/><circle cx="560" cy="260" r="6" fill="#56d364"/>
  </g>

  <text x="120" y="64" text-anchor="middle" font-size="10.5" fill="#9aa4b2">init</text>
  <text x="620" y="64" text-anchor="middle" font-size="10.5" fill="#9aa4b2">발표/제출</text>
  <text x="330" y="292" text-anchor="middle" font-size="10.5" fill="#586170" font-family="Consolas,monospace">develop에서 분기 → PR</text>
  <text x="530" y="292" text-anchor="middle" font-size="10.5" fill="#586170" font-family="Consolas,monospace">develop으로 병합</text>

  <text x="380" y="322" text-anchor="middle" font-size="12.5" fill="#c9d1d9">매일의 통합·QA는 <tspan fill="#58a6ff" font-weight="700">develop</tspan>에서 → main은 안정 시점만 받아 <tspan fill="#bc8cff" font-weight="700">깨짐 위험 흡수</tspan></text>
</svg>
