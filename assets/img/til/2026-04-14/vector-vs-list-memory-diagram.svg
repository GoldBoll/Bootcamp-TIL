<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-label="vector는 연속 메모리에 원소를 배치하고 list는 힙에 분산된 노드를 prev·next 포인터로 연결한다">
  <rect x="0" y="0" width="760" height="430" rx="14" fill="#1c2330" stroke="#39414f"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">vector 연속 메모리 vs list 분산 노드</text>
  <defs>
    <marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#e3b341"/></marker>
    <marker id="avp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#586170"/></marker>
  </defs>

  <!-- vector -->
  <text x="40" y="76" font-size="15" font-weight="600" fill="#58a6ff" font-family="Consolas,monospace">std::vector&lt;int&gt;</text>
  <text x="230" y="76" font-size="12.5" fill="#9aa4b2">— 힙 한 덩어리에 연속 배치 · operator new 1회</text>
  <g font-family="Consolas,monospace" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="60" y="92" width="72" height="52" fill="#1d2b3a" stroke="#58a6ff"/><text x="96" y="124" fill="#79c0ff">10</text>
    <rect x="132" y="92" width="72" height="52" fill="#1d2b3a" stroke="#58a6ff"/><text x="168" y="124" fill="#79c0ff">20</text>
    <rect x="204" y="92" width="72" height="52" fill="#1d2b3a" stroke="#58a6ff"/><text x="240" y="124" fill="#79c0ff">30</text>
    <rect x="276" y="92" width="72" height="52" fill="#1d2b3a" stroke="#58a6ff"/><text x="312" y="124" fill="#79c0ff">40</text>
    <rect x="348" y="92" width="72" height="52" fill="#151b26" stroke="#3d4859"/><text x="384" y="124" fill="#586170">·</text>
    <rect x="420" y="92" width="72" height="52" fill="#151b26" stroke="#3d4859"/><text x="456" y="124" fill="#586170">·</text>
  </g>
  <path d="M60,158 L348,158" stroke="#56d364" stroke-width="1.5"/>
  <text x="204" y="176" text-anchor="middle" font-size="11.5" fill="#56d364">size = 4</text>
  <path d="M60,158 L60,150 M492,158 L492,150 M60,166 L492,166" stroke="#9aa4b2" stroke-width="1.5" fill="none"/>
  <text x="276" y="186" text-anchor="middle" font-size="11.5" fill="#9aa4b2">capacity = 6</text>
  <text x="520" y="124" font-size="12" fill="#7ee787">주소 연속 → 캐시라인(64B)에 int 16개 → prefetch 작동</text>

  <line x1="40" y1="210" x2="720" y2="210" stroke="#39414f" stroke-dasharray="4 5"/>

  <!-- list -->
  <text x="40" y="238" font-size="15" font-weight="600" fill="#e3b341" font-family="Consolas,monospace">std::list&lt;int&gt;</text>
  <text x="200" y="238" font-size="12.5" fill="#9aa4b2">— 노드마다 힙 분산 할당 · prev/next 포인터로 연결</text>

  <!-- node A -->
  <g font-family="Consolas,monospace" font-size="12" text-anchor="middle">
    <g>
      <rect x="60" y="262" width="150" height="46" fill="#33291c" stroke="#e3b341"/>
      <line x1="110" y1="262" x2="110" y2="308" stroke="#e3b341"/><line x1="160" y1="262" x2="160" y2="308" stroke="#e3b341"/>
      <text x="85" y="280" fill="#9aa4b2" font-size="10">prev</text><text x="85" y="298" fill="#e6edf3">null</text>
      <text x="135" y="280" fill="#9aa4b2" font-size="10">next</text><text x="135" y="298" fill="#e6edf3">0x4F80</text>
      <text x="185" y="280" fill="#9aa4b2" font-size="10">data</text><text x="185" y="298" fill="#e3b341" font-weight="700">10</text>
      <text x="135" y="326" fill="#586170">0x1000</text>
    </g>
    <!-- node B (offset down) -->
    <g>
      <rect x="300" y="322" width="150" height="46" fill="#33291c" stroke="#e3b341"/>
      <line x1="350" y1="322" x2="350" y2="368" stroke="#e3b341"/><line x1="400" y1="322" x2="400" y2="368" stroke="#e3b341"/>
      <text x="325" y="340" fill="#9aa4b2" font-size="10">prev</text><text x="325" y="358" fill="#e6edf3">0x1000</text>
      <text x="375" y="340" fill="#9aa4b2" font-size="10">next</text><text x="375" y="358" fill="#e6edf3">0x9210</text>
      <text x="425" y="340" fill="#9aa4b2" font-size="10">data</text><text x="425" y="358" fill="#e3b341" font-weight="700">20</text>
      <text x="375" y="386" fill="#586170">0x4F80</text>
    </g>
    <!-- node C -->
    <g>
      <rect x="540" y="262" width="150" height="46" fill="#33291c" stroke="#e3b341"/>
      <line x1="590" y1="262" x2="590" y2="308" stroke="#e3b341"/><line x1="640" y1="262" x2="640" y2="308" stroke="#e3b341"/>
      <text x="565" y="280" fill="#9aa4b2" font-size="10">prev</text><text x="565" y="298" fill="#e6edf3">0x4F80</text>
      <text x="615" y="280" fill="#9aa4b2" font-size="10">next</text><text x="615" y="298" fill="#e6edf3">null</text>
      <text x="665" y="280" fill="#9aa4b2" font-size="10">data</text><text x="665" y="298" fill="#e3b341" font-weight="700">30</text>
      <text x="615" y="326" fill="#586170">0x9210</text>
    </g>
  </g>
  <!-- next arrows -->
  <path d="M135,308 C150,320 300,330 348,344" fill="none" stroke="#e3b341" stroke-width="2" marker-end="url(#av)"/>
  <path d="M425,322 C440,300 560,296 588,300" fill="none" stroke="#e3b341" stroke-width="2" marker-end="url(#av)"/>
  <!-- prev arrows (muted) -->
  <path d="M325,352 C250,360 150,335 120,310" fill="none" stroke="#586170" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#avp)"/>
  <path d="M565,300 C500,290 470,300 452,320" fill="none" stroke="#586170" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#avp)"/>

  <text x="380" y="416" text-anchor="middle" font-size="12" fill="#c9d1d9">노드가 주소상 흩어져 순회마다 <tspan fill="#ff7b72" font-weight="700">캐시 미스</tspan> → 이론 O(1) 삽입에도 실측은 vector 우위</text>
</svg>
