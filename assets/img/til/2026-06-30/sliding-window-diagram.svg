<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-label="고정 크기 슬라이딩 윈도우는 들어온 값을 더하고 빠진 값을 빼며 이동하고, 가변 크기 윈도우는 중복이 생기면 left를 중복 직후로 점프시킨다">
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#1c2330" stroke="#39414f"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">슬라이딩 윈도우 — 고정 크기 vs 가변 크기</text>
  <defs>
    <marker id="asw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#58a6ff"/></marker>
  </defs>

  <!-- FIXED -->
  <text x="40" y="70" font-size="14" font-weight="600" fill="#58a6ff">① 고정 크기 (k=4) — 합 최대 (LeetCode 643)</text>
  <g font-family="Consolas,monospace" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="120" y="86" width="70" height="50" fill="#263041" stroke="#3d4859"/><text x="155" y="117" fill="#e6edf3">1</text>
    <rect x="190" y="86" width="70" height="50" fill="#1d2b3a" stroke="#58a6ff"/><text x="225" y="117" fill="#79c0ff">12</text>
    <rect x="260" y="86" width="70" height="50" fill="#1d2b3a" stroke="#58a6ff"/><text x="295" y="117" fill="#79c0ff">-5</text>
    <rect x="330" y="86" width="70" height="50" fill="#1d2b3a" stroke="#58a6ff"/><text x="365" y="117" fill="#79c0ff">-6</text>
    <rect x="400" y="86" width="70" height="50" fill="#1d2b3a" stroke="#58a6ff"/><text x="435" y="117" fill="#79c0ff">50</text>
    <rect x="470" y="86" width="70" height="50" fill="#263041" stroke="#3d4859"/><text x="505" y="117" fill="#e6edf3">3</text>
  </g>
  <rect x="186" y="82" width="288" height="58" rx="6" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="330" y="160" text-anchor="middle" font-size="11.5" fill="#79c0ff" font-family="Consolas,monospace">window [1..4] = 12-5-6+50 = 51</text>
  <text x="155" y="176" text-anchor="middle" font-size="11" fill="#ff7b72" font-family="Consolas,monospace">− 빠짐(1)</text>
  <text x="505" y="176" text-anchor="middle" font-size="11" fill="#56d364" font-family="Consolas,monospace">+ 들어옴(3)</text>
  <text x="576" y="105" font-size="12.5" fill="#c9d1d9" font-family="Consolas,monospace">sum +=</text>
  <text x="576" y="123" font-size="12.5" fill="#c9d1d9" font-family="Consolas,monospace"> nums[i]</text>
  <text x="576" y="141" font-size="12.5" fill="#c9d1d9" font-family="Consolas,monospace"> − nums[i-k]</text>

  <line x1="40" y1="200" x2="720" y2="200" stroke="#39414f" stroke-dasharray="4 5"/>

  <!-- VARIABLE -->
  <text x="40" y="230" font-size="14" font-weight="600" fill="#e3b341">② 가변 크기 — 중복 없는 최장 부분문자열 (LeetCode 3)</text>
  <g font-family="Consolas,monospace" font-size="17" font-weight="700" text-anchor="middle">
    <rect x="120" y="248" width="58" height="50" fill="#263041" stroke="#3d4859"/><text x="149" y="280" fill="#9aa4b2">a</text>
    <rect x="178" y="248" width="58" height="50" fill="#33291c" stroke="#e3b341"/><text x="207" y="280" fill="#e3b341">b</text>
    <rect x="236" y="248" width="58" height="50" fill="#33291c" stroke="#e3b341"/><text x="265" y="280" fill="#e3b341">c</text>
    <rect x="294" y="248" width="58" height="50" fill="#33291c" stroke="#e3b341"/><text x="323" y="280" fill="#e3b341">a</text>
    <rect x="352" y="248" width="58" height="50" fill="#263041" stroke="#3d4859"/><text x="381" y="280" fill="#c9d1d9">b</text>
    <rect x="410" y="248" width="58" height="50" fill="#263041" stroke="#3d4859"/><text x="439" y="280" fill="#c9d1d9">c</text>
    <rect x="468" y="248" width="58" height="50" fill="#263041" stroke="#3d4859"/><text x="497" y="280" fill="#c9d1d9">b</text>
    <rect x="526" y="248" width="58" height="50" fill="#263041" stroke="#3d4859"/><text x="555" y="280" fill="#c9d1d9">b</text>
  </g>
  <!-- indices -->
  <g font-family="Consolas,monospace" font-size="10.5" fill="#586170" text-anchor="middle">
    <text x="149" y="314">0</text><text x="207" y="314">1</text><text x="265" y="314">2</text><text x="323" y="314">3</text>
    <text x="381" y="314">4</text><text x="439" y="314">5</text><text x="497" y="314">6</text><text x="555" y="314">7</text>
  </g>
  <rect x="174" y="244" width="182" height="58" rx="6" fill="none" stroke="#e3b341" stroke-width="2.5"/>
  <!-- left jump -->
  <path d="M149,336 C160,352 185,352 205,340" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#asw)"/>
  <text x="149" y="332" text-anchor="middle" font-size="10.5" fill="#586170" font-family="Consolas,monospace">이전 left</text>
  <text x="207" y="356" text-anchor="middle" font-size="10.5" fill="#79c0ff" font-family="Consolas,monospace">left 점프</text>
  <text x="323" y="332" text-anchor="middle" font-size="10.5" fill="#e3b341" font-family="Consolas,monospace">right='a' 중복</text>
  <text x="405" y="278" font-size="12" fill="#c9d1d9" font-family="Consolas,monospace">last['a']=0 ≥ left</text>
  <text x="405" y="296" font-size="12" fill="#c9d1d9" font-family="Consolas,monospace">→ left = last['a']+1 = 1</text>
  <text x="380" y="386" text-anchor="middle" font-size="12" fill="#9aa4b2">공통 본질 — 직전 결과 재활용해 매 스텝 O(1) 갱신 → 전체 O(n)</text>
</svg>
