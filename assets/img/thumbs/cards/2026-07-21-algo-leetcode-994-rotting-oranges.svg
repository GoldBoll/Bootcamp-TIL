<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="LeetCode 994 - Rotting Oranges (Medium)">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">994</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">1분마다 번짐</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- fresh cells -->
    <g stroke="#6f7681" stroke-width="6" stroke-dasharray="14 14">
      <rect x="742" y="250" width="96" height="96" rx="20"/>
      <rect x="852" y="252" width="96" height="96" rx="20"/>
      <rect x="740" y="470" width="96" height="96" rx="20"/>
      <rect x="850" y="468" width="96" height="96" rx="20"/>
      <rect x="742" y="360" width="96" height="96" rx="20"/>
      <rect x="852" y="360" width="96" height="96" rx="20"/>
    </g>

    <!-- minute 2 ring -->
    <g stroke="#FFA116" stroke-width="6" opacity="0.75">
      <rect x="300" y="250" width="96" height="96" rx="20"/>
      <rect x="522" y="252" width="96" height="96" rx="20"/>
      <rect x="298" y="470" width="96" height="96" rx="20"/>
      <rect x="520" y="468" width="96" height="96" rx="20"/>
      <rect x="632" y="360" width="96" height="96" rx="20"/>
    </g>

    <!-- minute 1 ring -->
    <g stroke="#FFA116" stroke-width="11">
      <rect x="300" y="360" width="96" height="96" rx="20"/>
      <rect x="410" y="250" width="96" height="96" rx="20"/>
      <rect x="410" y="470" width="96" height="96" rx="20"/>
      <rect x="522" y="360" width="96" height="96" rx="20"/>
    </g>

    <!-- spreading wave -->
    <g stroke="#FFA116" stroke-width="9" opacity="0.55">
      <path d="M990 330 Q 1042 408 992 486"/>
    </g>
    <g stroke="#FFA116" stroke-width="9" opacity="0.3">
      <path d="M1064 296 Q 1136 408 1066 520"/>
    </g>
  </g>

  <!-- the rotten cell -->
  <rect x="410" y="360" width="96" height="96" rx="20" fill="#FFA116"/>
  <circle cx="458" cy="408" r="20" fill="#1d1e22"/>

  <g font-family="'Consolas','Courier New',monospace" font-size="46" font-weight="700" fill="#FFA116" text-anchor="middle">
    <text x="348" y="424">1</text>
    <text x="458" y="314">1</text>
    <text x="458" y="534">1</text>
    <text x="570" y="424">1</text>
    <text x="348" y="314" opacity="0.75">2</text>
    <text x="570" y="316" opacity="0.75">2</text>
    <text x="346" y="534" opacity="0.75">2</text>
    <text x="568" y="532" opacity="0.75">2</text>
    <text x="680" y="424" opacity="0.75">2</text>
  </g>
</svg>
