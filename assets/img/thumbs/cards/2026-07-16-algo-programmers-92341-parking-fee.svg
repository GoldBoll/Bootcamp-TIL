<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 92341 - 주차 요금 계산 (Lv.5)">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">92341</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">누적 시간 → 계단 요금</text>

  <defs>
    <marker id="dn" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#6f7681"/>
    </marker>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 하루 타임라인 00:00 ~ 23:59 -->
    <path d="M300 300 H 1120" fill="none" stroke="#6f7681" stroke-width="8"/>
    <g fill="#6f7681" stroke="none">
      <rect x="296" y="272" width="8" height="56" rx="4"/>
      <rect x="1112" y="272" width="8" height="56" rx="4"/>
    </g>

    <!-- 출차한 주차 구간 -->
    <g fill="#FFA116" stroke="none">
      <rect x="322" y="278" width="196" height="44" rx="14"/>
      <rect x="596" y="278" width="132" height="44" rx="14"/>
    </g>
    <!-- 미출차 구간 — 23:59까지 정산 -->
    <rect x="832" y="278" width="280" height="44" rx="14" fill="none" stroke="#FFA116" stroke-width="7" stroke-dasharray="22 18"/>

    <!-- 누적 시간이 계단 요금으로 -->
    <path d="M420 352 V 470" fill="none" stroke="#6f7681" stroke-width="10" marker-end="url(#dn)"/>

    <!-- 기본시간 경계 -->
    <path d="M596 400 V 566" fill="none" stroke="#6f7681" stroke-width="8" stroke-dasharray="16 16"/>
    <path d="M300 566 H 1120" fill="none" stroke="#6f7681" stroke-width="8"/>

    <!-- 요금 계단: 기본시간까지 평평, 넘으면 단위시간마다 한 칸 -->
    <path d="M322 528 H 596 V 486 H 730 V 444 H 864 V 402 H 998 V 360 H 1112"
          fill="none" stroke="#FFA116" stroke-width="14"/>
  </g>
</svg>
