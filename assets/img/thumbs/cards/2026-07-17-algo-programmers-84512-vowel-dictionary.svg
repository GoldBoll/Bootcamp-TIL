<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 84512 - 모음사전 (Lv.5)">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">84512</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">사전순 = DFS 방문순서</text>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 루트에서 뻗는 형제 가지 -->
    <g stroke="#6f7681" stroke-width="8">
      <path d="M660 245 L 540 360"/>
      <path d="M660 245 L 720 360"/>
      <path d="M660 245 L 900 360"/>
      <path d="M360 360 L 390 470"/>
      <path d="M360 360 L 530 470"/>
      <path d="M250 470 L 300 575"/>
    </g>
    <!-- 사전순 첫 경로 = DFS가 가장 먼저 내려가는 왼쪽 척추 -->
    <g stroke="#FFA116" stroke-width="14">
      <path d="M660 245 L 360 360"/>
      <path d="M360 360 L 250 470"/>
      <path d="M250 470 L 180 575"/>
    </g>

    <g fill="#6f7681" stroke="none">
      <circle cx="540" cy="360" r="26"/>
      <circle cx="720" cy="360" r="26"/>
      <circle cx="900" cy="360" r="26"/>
      <circle cx="390" cy="470" r="24"/>
      <circle cx="530" cy="470" r="24"/>
      <circle cx="300" cy="575" r="22"/>
    </g>
    <circle cx="660" cy="245" r="24" stroke="#6f7681" stroke-width="9"/>
    <g fill="#FFA116" stroke="none">
      <circle cx="360" cy="360" r="30"/>
      <circle cx="250" cy="470" r="27"/>
      <circle cx="180" cy="575" r="24"/>
    </g>
  </g>

  <!-- 방문 순번이 곧 사전 순번 -->
  <g font-family="'Consolas','Courier New',monospace" font-size="42" font-weight="700" fill="#FFA116" text-anchor="middle">
    <text x="288" y="374">1</text>
    <text x="176" y="484">2</text>
    <text x="108" y="589">3</text>
  </g>
  <!-- 다섯 갈래가 계속 이어진다 -->
  <g fill="#6f7681" stroke="none">
    <circle cx="620" cy="552" r="9"/>
    <circle cx="660" cy="552" r="9"/>
    <circle cx="700" cy="552" r="9"/>
  </g>
</svg>
