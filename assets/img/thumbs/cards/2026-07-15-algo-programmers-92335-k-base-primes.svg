  <g fill="none" stroke="#6f7681" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M708 372 V 400 H 770 V 372"/>
    <path d="M844 372 V 400 H 906 V 372"/>
  </g>

  <!-- 소수 판정 결과 -->
  <g fill="none" stroke="#FFA116" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M373 470 L 393 496 L 427 444"/>
    <path d="M577 470 L 597 496 L 631 444"/>
    <path d="M1019 470 L 1039 496 L 1073 444"/>
  </g>
  <g fill="none" stroke="#6f7681" stroke-width="12" stroke-linecap="round">
    <path d="M719 452 L 759 492"/>
    <path d="M759 452 L 719 492"/>
    <path d="M855 452 L 895 492"/>
    <path d="M895 452 L 855 492"/>
