<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 12928 - 약수의 합">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">12928</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">약수는 짝으로</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 대각선: i * i = n 경계 -->
    <path d="M180 560 L 700 240" stroke="#6f7681" stroke-width="10" stroke-dasharray="20 22"/>

    <!-- 짝을 잇는 아치 3개: 작은 쪽(왼쪽) ↔ 큰 쪽(오른쪽) -->
    <g stroke="#FFA116" stroke-width="12">
      <path d="M228 486 Q 560 236 1024 486"/>
      <path d="M330 486 Q 570 300 920 486"/>
      <path d="M432 486 Q 578 372 818 486"/>
    </g>

    <!-- 작은 약수 = √n 이하, 실제로 훑는 구간 -->
    <g fill="#FFA116" stroke="none">
      <circle cx="228" cy="486" r="24"/>
      <circle cx="330" cy="486" r="24"/>
      <circle cx="432" cy="486" r="24"/>
    </g>

    <!-- 큰 약수 = n/i, 훑지 않고 따라오는 쪽 -->
    <g stroke="#6f7681" stroke-width="11">
      <circle cx="818" cy="486" r="24"/>
      <circle cx="920" cy="486" r="24"/>
      <circle cx="1024" cy="486" r="24"/>
    </g>

    <!-- 수직선 -->
    <path d="M180 542 L 1080 542" stroke="#6f7681" stroke-width="10"/>

    <!-- √n 지점: 짝의 두 값이 겹치는 가운데 약수 (한 번만 더함) -->
    <circle cx="626" cy="486" r="34" fill="#f5f6f8" stroke="#FFA116" stroke-width="12"/>
    <path d="M626 486 L 626 300" stroke="#FFA116" stroke-width="10" stroke-dasharray="16 18"/>

    <!-- 훑는 구간 표시 바 (1 .. √n) -->
    <path d="M204 594 L 626 594" stroke="#FFA116" stroke-width="14"/>
    <path d="M626 594 L 1056 594" stroke="#6f7681" stroke-width="14" stroke-dasharray="22 24"/>
  </g>
</svg>
