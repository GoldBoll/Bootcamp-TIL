  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">다음 수, 다른 비트 2개</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- row 1 : 7 = 0111 -->
    <rect x="384" y="252" width="96" height="96" rx="22" stroke="#FFA116" stroke-width="9"/>
    <rect x="496" y="252" width="96" height="96" rx="22" stroke="#FFA116" stroke-width="9"/>
