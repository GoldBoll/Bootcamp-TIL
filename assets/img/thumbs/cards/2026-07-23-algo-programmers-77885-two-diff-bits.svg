    <rect x="496" y="424" width="96" height="96" rx="22" fill="#FFA116" stroke="#FFA116" stroke-width="9"/>
    <rect x="608" y="424" width="96" height="96" rx="22" stroke="#6f7681" stroke-width="8"/>
    <rect x="720" y="424" width="96" height="96" rx="22" stroke="#6f7681" stroke-width="8"/>

    <!-- flipped columns -->
