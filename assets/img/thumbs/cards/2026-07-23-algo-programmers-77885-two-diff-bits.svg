  <g font-family="'Consolas','Courier New',monospace" font-weight="700" text-anchor="middle">
    <text x="432" y="322" font-size="58" fill="#e6e9ee">0</text>
    <text x="544" y="322" font-size="58" fill="#e6e9ee">1</text>
