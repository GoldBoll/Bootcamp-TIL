<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 12931 - 자릿수 더하기">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">12931</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">자리 떼어 모으기</text>

  <defs>
    <marker id="ds" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#FFA116"/>
    </marker>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1행: 세 자리 수. 마지막 칸이 떼어진다 -->
    <g stroke="#6f7681" stroke-width="11">
      <rect x="150" y="230" width="80" height="80" rx="14"/>
      <rect x="248" y="230" width="80" height="80" rx="14"/>
    </g>
    <rect x="346" y="230" width="80" height="80" rx="14" fill="none" stroke="#FFA116" stroke-width="12"/>

    <!-- 2행: /10 한 뒤 두 자리 -->
    <g stroke="#6f7681" stroke-width="11">
      <rect x="150" y="356" width="80" height="80" rx="14"/>
    </g>
    <rect x="248" y="356" width="80" height="80" rx="14" fill="none" stroke="#FFA116" stroke-width="12"/>

    <!-- 3행: 마지막 한 자리 -->
    <rect x="150" y="482" width="80" height="80" rx="14" fill="none" stroke="#FFA116" stroke-width="12"/>

    <!-- /10 로 한 칸씩 내려가는 진행 -->
    <g stroke="#6f7681" stroke-width="11" marker-end="url(#ds)">
      <path d="M190 322 L 190 344"/>
      <path d="M190 448 L 190 470"/>
    </g>

    <!-- 떼어낸 자리들이 오른쪽 누적 통으로 모임 -->
    <g stroke="#FFA116" stroke-width="12" marker-end="url(#ds)">
      <path d="M442 270 Q 640 270 760 350"/>
      <path d="M344 396 Q 600 396 762 396"/>
      <path d="M246 522 Q 600 522 760 442"/>
    </g>

    <!-- 누적 통 -->
    <circle cx="852" cy="396" r="76" fill="#f5f6f8" stroke="#FFA116" stroke-width="13"/>
    <g stroke="#1d1e22" stroke-width="14">
      <path d="M818 396 L 886 396"/>
      <path d="M852 362 L 852 430"/>
    </g>

    <!-- 자릿수 = 루프 횟수 눈금 (최대 9) -->
    <g stroke="#6f7681" stroke-width="12">
      <path d="M986 340 L 986 452"/>
      <path d="M1030 356 L 1030 452"/>
      <path d="M1074 384 L 1074 452"/>
      <path d="M1118 414 L 1118 452"/>
    </g>
    <path d="M962 486 L 1142 486" stroke="#FFA116" stroke-width="12"/>
  </g>
</svg>
