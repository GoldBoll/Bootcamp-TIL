      <circle cx="812" cy="365" r="26" fill="#FFA116"/>
      <circle cx="900" cy="365" r="26" fill="#6f7681"/>
      <circle cx="988" cy="365" r="26" fill="#FFA116"/>
    </g>

    <!-- cut -->
    <path d="M 600 244 L 600 486" stroke="#FFA116" stroke-width="15" stroke-dasharray="28 22"/>
  </g>

  <g font-family="'Consolas','Courier New',monospace" font-weight="700" text-anchor="middle">
    <text x="372" y="578" font-size="66" fill="#e6e9ee">3</text>
    <text x="600" y="578" font-size="66" fill="#FFA116">=</text>
    <text x="828" y="578" font-size="66" fill="#e6e9ee">3</text>
