<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 12926 - 시저 암호 (Lv.1)">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">12926</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">알파벳 26칸 감기</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- alphabet track -->
    <rect x="180" y="368" width="740" height="120" rx="60" stroke="#6f7681" stroke-width="9"/>
    <g stroke="#4a4f57" stroke-width="5">
      <path d="M296 386 L 296 470"/>
      <path d="M354 386 L 354 470"/>
      <path d="M412 386 L 412 470"/>
      <path d="M470 386 L 470 470"/>
      <path d="M528 386 L 528 470"/>
      <path d="M586 386 L 586 470"/>
      <path d="M644 386 L 644 470"/>
      <path d="M702 386 L 702 470"/>
      <path d="M760 386 L 760 470"/>
      <path d="M818 386 L 818 470"/>
    </g>

    <!-- shift by n inside the track -->
    <path d="M300 428 L 596 428" stroke="#FFA116" stroke-width="12"/>
    <polygon points="626,428 588,408 588,448" fill="#FFA116"/>

    <!-- wrap-around from z back to a -->
    <path d="M866 350 C 878 214, 222 214, 234 344" stroke="#FFA116" stroke-width="14"/>
    <polygon points="234,372 212,332 256,332" fill="#FFA116"/>

    <circle cx="234" cy="428" r="34" fill="#FFA116"/>
    <circle cx="866" cy="428" r="34" fill="#FFA116"/>
  </g>

  <g font-family="'Consolas','Courier New',monospace" font-weight="700" text-anchor="middle">
    <text x="234" y="444" font-size="44" fill="#1d1e22">a</text>
    <text x="866" y="444" font-size="44" fill="#1d1e22">z</text>
    <text x="550" y="196" font-size="52" fill="#FFA116">% 26</text>
    <text x="462" y="562" font-size="46" fill="#e6e9ee">c - base + n</text>
    <text x="550" y="612" font-size="38" fill="#8d949e">공백은 건너뛴다</text>
  </g>
</svg>
