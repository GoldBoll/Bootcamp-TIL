<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 120831 - 짝수의 합 (Lv.0)">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">120831</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">두 번 세면 직사각형</text>

  <!-- 짝수 막대 2,4,6,8,10 (주황) + 뒤집은 사본(회색)이 합쳐져 half x (half+1) 직사각형 -->
  <g>
    <rect x="280" y="500" width="100" height="60"  rx="6" fill="#FFA116"/>
    <rect x="420" y="440" width="100" height="120" rx="6" fill="#FFA116"/>
    <rect x="560" y="380" width="100" height="180" rx="6" fill="#FFA116"/>
    <rect x="700" y="320" width="100" height="240" rx="6" fill="#FFA116"/>
    <rect x="840" y="260" width="100" height="300" rx="6" fill="#FFA116"/>

    <rect x="280" y="260" width="100" height="240" rx="6" fill="#6f7681"/>
    <rect x="420" y="260" width="100" height="180" rx="6" fill="#6f7681"/>
    <rect x="560" y="260" width="100" height="120" rx="6" fill="#6f7681"/>
    <rect x="700" y="260" width="100" height="60"  rx="6" fill="#6f7681"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="264" y="244" width="692" height="332" rx="14" stroke="#FFA116" stroke-width="8" stroke-dasharray="22 20"/>

    <!-- 가로 = 짝수 개수(half), 세로 = half+1 -->
    <path d="M264 610 L 956 610" stroke="#6f7681" stroke-width="9"/>
    <path d="M264 592 L 264 628" stroke="#6f7681" stroke-width="9"/>
    <path d="M956 592 L 956 628" stroke="#6f7681" stroke-width="9"/>

    <path d="M1010 244 L 1010 576" stroke="#6f7681" stroke-width="9"/>
    <path d="M992 244 L 1028 244" stroke="#6f7681" stroke-width="9"/>
    <path d="M992 576 L 1028 576" stroke="#6f7681" stroke-width="9"/>
  </g>
</svg>
