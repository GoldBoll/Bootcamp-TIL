<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 12930 - 이상한 문자 만들기 (Lv.1)">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">12930</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">단어별 인덱스 리셋</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- baseline -->
    <path d="M110 492 L 1080 492" stroke="#3a3f47" stroke-width="6"/>

    <!-- word 1: tall = uppercase, short = lowercase -->
    <rect x="130" y="330" width="100" height="160" rx="16" stroke="#FFA116" stroke-width="10"/>
    <rect x="250" y="400" width="100" height="90" rx="16" stroke="#6f7681" stroke-width="10"/>
    <rect x="370" y="330" width="100" height="160" rx="16" stroke="#FFA116" stroke-width="10"/>

    <!-- word boundary (space) -->
    <path d="M540 258 L 540 500" stroke="#8d949e" stroke-width="7" stroke-dasharray="14 16"/>

    <!-- reset arc back to index 0 -->
    <path d="M470 300 C 470 216, 610 216, 610 296" stroke="#FFA116" stroke-width="12"/>
    <polygon points="610,318 592,282 628,282" fill="#FFA116"/>

    <!-- word 2 -->
    <rect x="610" y="330" width="100" height="160" rx="16" stroke="#FFA116" stroke-width="10"/>
    <rect x="730" y="400" width="100" height="90" rx="16" stroke="#6f7681" stroke-width="10"/>
    <rect x="850" y="330" width="100" height="160" rx="16" stroke="#FFA116" stroke-width="10"/>
    <rect x="970" y="400" width="100" height="90" rx="16" stroke="#6f7681" stroke-width="10"/>
  </g>

  <g font-family="'Consolas','Courier New',monospace" font-weight="700" text-anchor="middle">
    <g font-size="60">
      <text x="180" y="440" fill="#FFA116">A</text>
      <text x="300" y="470" fill="#8d949e">a</text>
      <text x="420" y="440" fill="#FFA116">A</text>
      <text x="660" y="440" fill="#FFA116">A</text>
      <text x="780" y="470" fill="#8d949e">a</text>
      <text x="900" y="440" fill="#FFA116">A</text>
      <text x="1020" y="470" fill="#8d949e">a</text>
    </g>
    <g font-size="42" fill="#6f7681">
      <text x="180" y="556">0</text>
      <text x="300" y="556">1</text>
      <text x="420" y="556">2</text>
      <text x="660" y="556">0</text>
      <text x="780" y="556">1</text>
      <text x="900" y="556">2</text>
      <text x="1020" y="556">3</text>
    </g>
    <text x="540" y="196" font-size="46" fill="#FFA116">idx = 0</text>
  </g>
</svg>
