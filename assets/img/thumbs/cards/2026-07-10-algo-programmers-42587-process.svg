<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 42587 프로세스 - 꺼내고 되돌리는 대기열">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">42587</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">꺼내고 되돌리는 대기열</text>

  <defs>
    <marker id="hOrange" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11 z" fill="#FFA116"/>
    </marker>
    <marker id="hGray" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11 z" fill="#8d949e"/>
    </marker>
  </defs>

  <!-- queue slots, front on the left -->
  <g fill="none" stroke="#6f7681" stroke-width="12">
    <rect x="300" y="330" width="160" height="120" rx="30"/>
    <rect x="490" y="330" width="160" height="120" rx="30"/>
    <rect x="870" y="330" width="160" height="120" rx="30"/>
  </g>
  <rect x="680" y="330" width="160" height="120" rx="30" fill="none" stroke="#FFA116" stroke-width="16"/>

  <g font-family="'Consolas','Courier New',monospace" font-size="60" font-weight="700" text-anchor="middle">
    <text x="380" y="412" fill="#b9bfc8">2</text>
    <text x="570" y="412" fill="#b9bfc8">1</text>
    <text x="760" y="412" fill="#FFA116">9</text>
    <text x="950" y="412" fill="#b9bfc8">2</text>
  </g>

  <!-- pop from the front -->
  <path d="M 280 390 L 140 390" fill="none" stroke="#8d949e" stroke-width="13" stroke-linecap="round" marker-end="url(#hGray)"/>

  <!-- lower priority goes back to the tail -->
  <path d="M 150 340 V 200 H 1090 V 320" fill="none" stroke="#8d949e" stroke-width="12" stroke-linecap="round" stroke-dasharray="26 24" marker-end="url(#hGray)"/>

  <!-- the current max leaves for good -->
  <path d="M 760 480 V 570" fill="none" stroke="#FFA116" stroke-width="16" stroke-linecap="round" marker-end="url(#hOrange)"/>
  <g stroke="#e6e9ee" stroke-width="14" stroke-linecap="round">
    <path d="M 190 250 L 250 310"/>
    <path d="M 250 250 L 190 310"/>
  </g>
</svg>
