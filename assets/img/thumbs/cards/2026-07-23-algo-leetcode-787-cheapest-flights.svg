  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">싼 길 vs 환승 제한</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- expensive direct hop -->
    <path d="M234 356 Q 626 178 1014 352" stroke="#6f7681" stroke-width="12"/>

