    <g stroke="#e6e9ee" stroke-width="15">
      <path d="M728 506 L 798 572"/>
      <path d="M798 506 L 728 572"/>
    </g>

    <circle cx="460" cy="536" r="26" fill="#FFA116"/>
    <circle cx="762" cy="540" r="26" fill="#6f7681"/>
    <circle cx="196" cy="392" r="38" fill="#f5f6f8" stroke="#FFA116" stroke-width="11"/>
    <circle cx="1044" cy="392" r="38" fill="#f5f6f8" stroke="#FFA116" stroke-width="11"/>
  </g>

  <g font-family="'Consolas','Courier New',monospace" font-weight="700" text-anchor="middle">
    <rect x="546" y="198" width="150" height="66" rx="33" fill="#1d1e22" stroke="#6f7681" stroke-width="5"/>
    <text x="621" y="245" font-size="40" fill="#b9bfc8">700</text>
    <rect x="252" y="266" width="150" height="66" rx="33" fill="#1d1e22" stroke="#FFA116" stroke-width="5"/>
