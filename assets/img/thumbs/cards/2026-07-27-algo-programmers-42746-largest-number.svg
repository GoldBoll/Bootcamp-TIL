<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="프로그래머스 42746 가장 큰 수 - 이어 붙여 비교하는 정렬 비교자">
  <rect width="1200" height="630" fill="#1d1e22"/>
  <rect width="14" height="630" fill="#FFA116"/>
  <text x="66" y="110" font-family="'Consolas','Courier New',monospace" font-size="66" font-weight="700" fill="#FFA116">42746</text>
  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">이어 붙여 비교</text>

  <g font-family="'Consolas','Courier New',monospace" font-weight="700" text-anchor="middle">
    <!-- winning order: 3 then 30 -->
    <rect x="96" y="242" width="112" height="112" rx="28" fill="#1d1e22" stroke="#FFA116" stroke-width="10"/>
    <text x="152" y="320" font-size="60" fill="#FFA116">3</text>
    <rect x="232" y="242" width="176" height="112" rx="28" fill="#1d1e22" stroke="#FFA116" stroke-width="10"/>
    <text x="320" y="320" font-size="60" fill="#FFA116">30</text>
    <rect x="574" y="242" width="272" height="112" rx="28" fill="#FFA116"/>
    <text x="710" y="320" font-size="60" fill="#1d1e22">330</text>

    <!-- losing order: 30 then 3 -->
    <rect x="96" y="410" width="176" height="112" rx="28" fill="#1d1e22" stroke="#6f7681" stroke-width="10"/>
    <text x="184" y="488" font-size="60" fill="#6f7681">30</text>
    <rect x="296" y="410" width="112" height="112" rx="28" fill="#1d1e22" stroke="#6f7681" stroke-width="10"/>
    <text x="352" y="488" font-size="60" fill="#6f7681">3</text>
    <rect x="574" y="410" width="272" height="112" rx="28" fill="#1d1e22" stroke="#6f7681" stroke-width="10"/>
    <text x="710" y="488" font-size="60" fill="#6f7681">303</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- concat arrows -->
    <g stroke="#FFA116" stroke-width="12">
      <path d="M440 298 H 536"/>
      <path d="M502 268 L 540 298 L 502 328"/>
    </g>
    <g stroke="#6f7681" stroke-width="12">
      <path d="M440 466 H 536"/>
      <path d="M502 436 L 540 466 L 502 496"/>
    </g>

    <!-- verdicts -->
    <path d="M902 300 L 936 336 L 1010 258" stroke="#FFA116" stroke-width="18"/>
    <g stroke="#6f7681" stroke-width="15">
      <path d="M910 436 L 986 512"/>
      <path d="M986 436 L 910 512"/>
    </g>
  </g>

  <text x="96" y="596" font-family="'Consolas','Courier New',monospace" font-size="44" font-weight="700" fill="#8d949e">a + b &gt; b + a</text>
</svg>
