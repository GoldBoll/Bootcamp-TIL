    <path d="M244 438 Q 330 372 398 330" stroke="#FFA116" stroke-width="14"/>
    <path d="M410 336 Q 508 388 596 402" stroke="#FFA116" stroke-width="14"/>
    <path d="M612 396 Q 700 348 782 306" stroke="#FFA116" stroke-width="14"/>
    <path d="M796 312 Q 884 340 948 358" stroke="#FFA116" stroke-width="14"/>

    <circle cx="402" cy="330" r="26" fill="#FFA116"/>
    <circle cx="604" cy="402" r="26" fill="#FFA116"/>
    <circle cx="790" cy="306" r="26" fill="#FFA116"/>

    <!-- start / end -->
    <circle cx="238" cy="442" r="34" fill="#f5f6f8" stroke="#FFA116" stroke-width="10"/>
    <circle cx="956" cy="360" r="34" fill="#f5f6f8" stroke="#FFA116" stroke-width="10"/>
  </g>

  <text x="1088" y="404" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="150" font-weight="700" fill="#FFA116">?</text>
