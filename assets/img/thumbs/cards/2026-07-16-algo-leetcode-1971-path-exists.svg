  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">경로 존재?</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
