  <text x="70" y="162" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="36" font-weight="600" fill="#b9bfc8">완성일로 묶는 배포</text>

  <!-- progress tracks -->
  <g fill="none" stroke="#6f7681" stroke-width="8">
    <rect x="80" y="248" width="620" height="68" rx="34"/>
    <rect x="80" y="368" width="620" height="68" rx="34"/>
    <rect x="80" y="488" width="620" height="68" rx="34"/>
