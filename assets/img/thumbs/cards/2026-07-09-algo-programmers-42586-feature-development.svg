  <!-- grouping brackets: rows 1-2 ship together, row 3 alone -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 920 254 h 40 v 176 h -40" stroke="#FFA116" stroke-width="13"/>
    <path d="M 920 494 h 40 v 56 h -40" stroke="#6f7681" stroke-width="13"/>
